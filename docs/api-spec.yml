# Contrato de la API propia del sitio de Nubolabs (Next.js Route Handlers bajo /api).
# Se actualiza en el mismo cambio que agrega o modifica un endpoint (documentation-standards.md §3).
# Convenciones: éxito → { ok: true, ... }; error → { error: "<mensaje en español>" } con el status HTTP correspondiente.
openapi: 3.0.3
info:
  title: Nubolabs Web API
  version: 1.0.0
  description: |
    Endpoints públicos para captar leads y generar el informe de diagnóstico, y endpoints
    protegidos del panel de administración (sesión, CMS, equipo, leads, subida de fotos).
    Los endpoints protegidos exigen la cookie `admin_session` creada en `POST /api/admin/session`.
servers:
  - url: https://www.nubolabs.cl
    description: Producción (Vercel)
  - url: http://localhost:3000
    description: Local (`npm run dev`; sin credenciales de Firebase no se persiste y `/admin` queda abierto)

tags:
  - name: público
  - name: admin

paths:
  /api/leads:
    post:
      tags: [público]
      summary: Registra un lead (formulario de contacto o diagnóstico)
      description: |
        Valida y normaliza el cuerpo con `normalizeLead()` (`lib/leads.ts`), guarda el lead en Firestore (`leads`),
        envía el aviso por correo al equipo (Resend) y, si `source` es `diagnostico` y `meta.areas` trae al menos un área
        con puntaje, genera y envía el informe PDF al cliente (mapa de oportunidades, desde diagnostico-mapa-oportunidades).
        En los diagnósticos, el servidor rearma `meta` (`normalizeDiagnosticMeta`: 6 áreas con respuestas válidas, puntajes
        recalculados, solo preguntas abiertas conocidas, mapa calculado, sin `ahorro`) y el `message` (`diagnosticSummary`). Correo e informe no bloquean la respuesta. Sin Firebase Admin
        configurado responde `persisted: false`.

        Desde `landing-referidos-oa`: acepta `referral` opcional (hoy solo `oa`, para los leads que llegan por la
        entrada `/oa` del correo de Osorio & Asociados); cualquier otro valor se omite sin error.

        Desde `formulario-minimo-consentimiento` (**BREAKING**): `phone` (WhatsApp, 8 a 15 dígitos) y
        `contactConsent: true` son obligatorios. El servidor agrega la prueba del consentimiento (`consentAt` con su
        propia hora, `consentText` con el texto oficial de cada casilla aceptada y `consentVersion`); lo que mande el
        cliente en esos campos se ignora. `goals` e `industry` desconocidos se descartan sin error y un `source` fuera
        de la lista se guarda como `landing`. Si llega el campo trampa `website` con texto (honeypot), responde
        `200 { ok: true, persisted: false }` sin guardar ni avisar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "200":
          description: Lead recibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  persisted: { type: boolean, description: "false si Firebase Admin no está configurado" }
                  id: { type: string, description: "Id del documento en Firestore (solo si persisted)" }
        "400":
          description: |
            Cuerpo inválido. Mensajes: "JSON inválido.", "Solicitud inválida." (no es un objeto),
            "Nombre y email son obligatorios.", "El email no es válido.",
            "Revisa el WhatsApp: debe tener entre 8 y 15 dígitos." y "Necesitamos tu permiso para contactarte."
            (`contactConsent` distinto de `true`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: No se pudo guardar en Firestore
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/diagnostico/report:
    post:
      tags: [público]
      summary: Genera el informe de diagnóstico en PDF para descarga directa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                company: { type: string }
                meta: { $ref: "#/components/schemas/DiagnosticoMeta" }
              required: [meta]
      responses:
        "200":
          description: 'PDF (Content-Disposition: attachment; filename="Informe-diagnostico-Nubolabs.pdf")'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          description: "JSON inválido o `meta` sin áreas con puntaje: `{ error: \"Faltan datos del diagnóstico para generar el informe.\" }`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: No se pudo generar el PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/session:
    post:
      tags: [admin]
      summary: Inicia sesión — cambia un ID token de Firebase por la cookie de sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken: { type: string, description: "ID token obtenido con `signInWithEmailAndPassword` en el cliente" }
              required: [idToken]
      responses:
        "200":
          description: Sesión creada. Setea cookie `admin_session` (httpOnly, secure, sameSite=lax, 5 días)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Solicitud inválida o falta el token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No se pudo crear la sesión (token inválido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Firebase Admin no configurado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [admin]
      summary: Cierra sesión — borra la cookie
      responses:
        "200":
          description: Cookie eliminada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /api/admin/config:
    post:
      tags: [admin]
      summary: Guarda (merge) la configuración del sitio — visibilidad y/o contenido del CMS
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Al menos uno de `visible` o `content`
              properties:
                visible:
                  type: object
                  additionalProperties: { type: boolean }
                  description: "Claves de SECTIONS: hero, confianza, problema, resultados, enfoque, servicios, casos, cifras, proceso, contacto, faq, cierre, nosotros, equipo"
                  example: { hero: true, problema: true, resultados: false }
                content:
                  $ref: "#/components/schemas/SiteContentPartial"
      responses:
        "200": { description: Guardado, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { description: JSON inválido o nada que guardar, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/DbUnavailable" }

  /api/admin/team:
    post:
      tags: [admin]
      summary: Crea (sin `id`) o actualiza (con `id`) un integrante del equipo
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TeamMemberInput"
                - type: object
                  properties:
                    id: { type: string, description: "Si viene, actualiza ese documento (merge)" }
      responses:
        "200":
          description: Guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
        "400": { description: JSON inválido o falta `nombre`, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/DbUnavailable" }

  /api/admin/team/{id}:
    delete:
      tags: [admin]
      summary: Elimina un integrante del equipo
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eliminado, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/DbUnavailable" }

  /api/admin/leads/{id}:
    delete:
      tags: [admin]
      summary: Elimina un lead
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eliminado, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/DbUnavailable" }

  /api/admin/leads/{id}/pdf:
    get:
      tags: [admin]
      summary: Exporta la ficha completa de un lead a PDF
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 'PDF (Content-Disposition: attachment; filename="lead-<slug>.pdf"; Cache-Control: no-store)'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Lead no encontrado, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Base no configurada o error al generar el PDF, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/admin/upload:
    post:
      tags: [admin]
      summary: Sube una imagen a Vercel Blob y devuelve su URL pública
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: "Imagen ≤ 5 MB" }
              required: [file]
      responses:
        "200":
          description: Subida
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  url: { type: string, format: uri }
        "400": { description: Sin archivo o supera 5 MB, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Falta `BLOB_READ_WRITE_TOKEN` o falló la subida, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/admin/test-email:
    get:
      tags: [admin]
      summary: Diagnóstico — envía un correo de prueba y devuelve la respuesta de Resend sin exponer la clave
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Resultado del envío
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendKeyPresent: { type: boolean }
                  notifyEmail: { type: string }
                  notifyFrom: { type: string }
                  result: { $ref: "#/components/schemas/EmailResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
      description: Cookie de sesión de Firebase verificada en servidor por `getAdminSession()` (`lib/adminAuth.ts`)

  responses:
    Unauthorized:
      description: Sin sesión de admin válida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "No autorizado." }
    DbUnavailable:
      description: Firebase Admin no configurado o error de Firestore
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Base de datos no configurada." }

  schemas:
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
    Error:
      type: object
      properties:
        error: { type: string, description: "Mensaje en español apto para mostrar al usuario" }
      required: [error]

    LeadInput:
      type: object
      description: Definido en `types/lead.ts`; se valida con `normalizeLead()` en `lib/leads.ts`.
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30, description: "WhatsApp: 8 a 15 dígitos (se ignoran espacios, +, guiones)", example: "+56 9 1234 5678" }
        company: { type: string, maxLength: 120 }
        message: { type: string, maxLength: 1000 }
        source: { type: string, enum: [landing, diagnostico], description: "Otro valor se guarda como `landing`", example: landing }
        goals:
          type: array
          description: "Objetivos de `lib/leadOptions.ts` (GOALS); los desconocidos y repetidos se descartan"
          items: { type: string, enum: [sell_more, respond_faster, clear_numbers, collect_on_time, organize_team, drop_spreadsheets, grow_orderly, other] }
        industry: { type: string, enum: [gastronomia, automotriz, construccion, servicios, comercio, otro], description: "Un valor desconocido se descarta" }
        goalOther: { type: string, maxLength: 70, description: "Detalle escrito de 'Otra cosa'; se guarda solo si `goals` incluye `other` (recortado a 70)" }
        industryOther: { type: string, maxLength: 70, description: "Rubro escrito al elegir 'Otro'; se guarda solo si `industry` es `otro` (recortado a 70)" }
        contactConsent: { type: boolean, description: "Obligatorio y exactamente `true`" }
        marketingConsent: { type: boolean, description: "Opcional; solo `true` cuenta como aceptado" }
        website: { type: string, description: "Campo trampa (honeypot): debe llegar vacío o no venir" }
        referral: { type: string, enum: [oa], description: "Referidor de la visita (cambio landing-referidos-oa; lo agregan los formularios si la pestaña entró por /oa o /?ref=oa). Se recorta; otro valor se omite sin error. No cambia `source` ni el informe" }
        meta: { $ref: "#/components/schemas/DiagnosticoMeta" }
      required: [name, email, phone, contactConsent]

    DiagnosticoMeta:
      type: object
      description: Detalle estructurado del diagnóstico. Lo arma `components/diagnostico/DiagnosticoFlow.tsx`; lo lee `lib/report.ts`. Desde diagnostico-mapa-oportunidades el informe sale del mapa de oportunidades (calculado desde `areas`), sin índice ni ahorro.
      properties:
        rubro: { type: string }
        indiceFriccion: { type: number, description: "Dato interno (panel y ficha). Ya no es requerido para el informe" }
        nivelFriccion: { type: string }
        areas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [carga, plazos, info, procesos, conocimiento, clientes], description: "Desde diagnostico-mapa-oportunidades; los leads antiguos se identifican por `area`/`corto`" }
              area: { type: string }
              corto: { type: string }
              friccion: { type: number, minimum: 0, maximum: 100, description: "Puntaje del área; sin un área con puntaje válido no hay informe (400)" }
        oportunidades:
          type: object
          description: "Mapa de oportunidades. `POST /api/leads` lo recalcula en el servidor e ignora el del cliente"
          properties:
            version: { type: integer, example: 1 }
            dimensiones:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, enum: [ventas, control, orden, equipo] }
                  nombre: { type: string }
                  puntaje: { type: integer, nullable: true }
                  nivel: { type: string, enum: [alta, media, baja], nullable: true }
            principales: { type: array, items: { type: string }, maxItems: 3 }
            proximoPaso: { type: string }
        abiertas:
          type: array
          items:
            type: object
            properties:
              pregunta: { type: string }
              respuesta: { type: string }
        ahorro:
          nullable: true
          type: object
          description: "Solo leads anteriores a octubre de 2026. `POST /api/leads` lo descarta y el informe al cliente lo ignora"
          properties:
            totales:
              type: object
              properties:
                horas: { type: number }
                semana: { type: number }
                mes: { type: number }
                anual: { type: number }
            procesos:
              type: array
              items:
                type: object
                properties:
                  nombre: { type: string }
                  ahorroCLPMes: { type: number }

    TeamMemberInput:
      type: object
      description: Campos en español por consistencia con la colección `team`
      properties:
        nombre: { type: string }
        cargo: { type: string }
        habilidades: { type: array, items: { type: string } }
        fotoUrl: { type: string, description: "URL de Vercel Blob o data URL" }
        linkedin: { type: string, description: "Se antepone https:// si viene sin protocolo" }
        orden: { type: integer }
      required: [nombre]

    SiteContentPartial:
      type: object
      description: "Subconjunto de `SiteContent` (`lib/siteConfig.ts`); se mezcla sobre los defaults con `mergeConfig()`, que tolera textos vacíos o con forma inesperada. El admin envía solo las secciones modificadas de `MANAGED_KEYS` (nunca `equipo`, que guarda /admin/equipo); sin cambios de contenido envía solo `visible`"
      properties:
        hero:
          type: object
          properties:
            eyebrow: { type: string }
            title: { type: string, description: "Admite **resalte** para texto destacado con el degradado de marca" }
            subtitle: { type: string }
            ctaPrimary: { type: string }
            ctaSecondary: { type: string }
            tags:
              type: array
              description: "Etiquetas bajo los botones. Al leer se recortan, se descartan vacías y se usan como máximo 3; si queda vacía o no es arreglo se usan los defaults."
              items: { type: string }
              example: ["30 minutos, gratis y sin compromiso", "Sin cambiar tus sistemas", "Respuesta en menos de 24 horas"]
        confianza:
          type: object
          description: "Bloque Nos recomiendan (cambio confianza-recomendacion). Sin testimonios por defecto"
          properties:
            eyebrow: { type: string }
            textoPuente: { type: string, description: "Se muestra mientras no haya testimonios válidos" }
            testimonios:
              type: array
              description: "Solo con autorización escrita. Sin nombre o texto no se publica; se muestran hasta 3"
              items:
                type: object
                properties:
                  nombre: { type: string }
                  cargo: { type: string }
                  empresa: { type: string }
                  texto: { type: string }
                  destacado: { type: boolean, description: "Solo true exacto; el primero destacado va en el panel" }
            compromisos:
              type: array
              description: "Siempre 3 por posición; un título o texto vacío toma el recomendado de esa posición"
              items:
                type: object
                properties:
                  titulo: { type: string }
                  texto: { type: string }
        problema:
          type: object
          description: "¿Te suena? (cambio lenguaje-sin-jerga)"
          properties:
            eyebrow: { type: string }
            title: { type: string }
            subtitle: { type: string }
            items:
              type: array
              description: "1 a 8 dolores"
              items: { type: object, properties: { title: { type: string } } }
            cierre: { type: string, description: "Admite **resalte**" }
            cierreCta: { type: string, description: "Texto del enlace a #resultados" }
        resultados:
          type: object
          description: "Lo que ganas. La visibilidad usa la clave `resultados`"
          properties:
            eyebrow: { type: string }
            title: { type: string }
            subtitle: { type: string }
            items:
              type: array
              description: "Siempre 4 al leer: faltantes o inválidos toman el default de su posición; los sobrantes se descartan"
              items: { type: object, properties: { title: { type: string }, body: { type: string } } }
            cierre: { type: string }
        enfoque:
          type: object
          properties:
            eyebrow: { type: string }
            title: { type: string }
            body: { type: string }
            items:
              type: array
              description: "Siempre 3 al leer"
              items: { type: object, properties: { title: { type: string }, body: { type: string } } }
        servicios:
          type: object
          properties:
            eyebrow: { type: string }
            title: { type: string }
            subtitle: { type: string }
            destacado:
              type: object
              properties:
                etiqueta: { type: string }
                title: { type: string }
                body: { type: string }
                result: { type: string }
                incluye: { type: array, description: "1 a 4", items: { type: string } }
            items:
              type: array
              description: "1 a 6; `result` se muestra como \"lo que ganas\""
              items:
                type: object
                properties: { title: { type: string }, body: { type: string }, result: { type: string } }
            acompanamiento: { type: object, properties: { title: { type: string }, body: { type: string } } }
            notaTecnica: { type: string, description: "Único texto de la portada que nombra herramientas (n8n, Make). Admite **resalte**" }
        casos:
          type: object
          properties:
            eyebrow: { type: string }
            title: { type: string }
            subtitle: { type: string }
            items:
              type: array
              description: "1 a 18 (cambio casos-por-rubro). Sin casos con `title` se usan los 14 por defecto"
              items:
                type: object
                properties:
                  title: { type: string, description: "Texto principal" }
                  body: { type: string, description: "Detalle opcional" }
                  rubro:
                    type: string
                    enum: [todos, gastronomia, automotriz, construccion, servicios, comercio]
                    description: "Ausente, desconocido u `otro` se lee como `todos`"
        cifras:
          type: object
          description: "Cifras de resultados (cambio cifras-con-respaldo). Oculta por defecto (visible.cifras = false)"
          properties:
            items:
              type: array
              description: "Solo se publican las que tienen valor, texto y fuente; máximo 4"
              items:
                type: object
                properties:
                  valor: { type: string, example: "Mismo día" }
                  texto: { type: string, example: "en responder cotizaciones" }
                  fuente: { type: string, example: "Piloto con cliente de O&A, 2026" }
            frase: { type: string, description: "Se muestra sin cifras válidas; guardada vacía, la sección no se renderiza" }
        proceso:
          type: object
          description: "Cómo trabajamos (ancla #modelo)"
          properties:
            eyebrow: { type: string }
            title: { type: string }
            subtitle: { type: string }
            items:
              type: array
              description: "Siempre 4 al leer"
              items: { type: object, properties: { title: { type: string }, body: { type: string }, recibes: { type: string } } }
            exito:
              type: object
              properties:
                title: { type: string }
                items: { type: array, description: "1 a 6", items: { type: string } }
        nosotros:
          type: object
          properties:
            eyebrow: { type: string }
            title: { type: string }
            mision: { type: string }
            vision: { type: string }
            objetivos: { type: array, items: { type: string } }
        equipo:
          type: object
          properties:
            eyebrow: { type: string }
            title: { type: string }
            historia: { type: string }
        faq:
          type: object
          description: "Preguntas frecuentes (cambio cierre-landing-faq-cta)"
          properties:
            eyebrow: { type: string }
            title: { type: string }
            items:
              type: array
              description: "1 a 10; solo se publican las que tienen pregunta y respuesta"
              items:
                type: object
                properties:
                  pregunta: { type: string }
                  respuesta: { type: string, description: "Admite enlaces internos [texto](/ruta) o [texto](#ancla); otros destinos se muestran como texto" }
        cierre:
          type: object
          description: "CTA final"
          properties:
            eyebrow: { type: string }
